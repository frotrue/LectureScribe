[project]
name = "lecture-scribe"
version = "1.1.4"
description = "Local lecture transcription and OpenAI-powered Markdown summarization GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.23.0",
    "openai>=2.38.0",
    "pyside6>=6.10.0",
]

[dependency-groups]
dev = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "pyinstaller>=6.20.0",
]
